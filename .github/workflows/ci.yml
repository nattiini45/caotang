# The standing gate: lint, typecheck, unit tests, the production build and the Playwright suite.
#
# What runs, and on which Node:
#   - `verify` is a Node matrix (22.12.0 and 24): frozen engine-strict install, verify, build, bundle-size check,
#     MCP pack and CLI build. Both the declared 22.12 floor and current 24 line run on every PR and main push.
#   - `e2e (chromium)` runs on Node 24 in parallel with the matrix. `e2e-browsers.yml` gates pull requests with Firefox and
#     WebKit in four parallel shards, also runs nightly/on demand, and uploads their merged HTML report when a shard fails.
#   - `office-interop` and `pdf-validate` remain separate Node 24 jobs and run alongside the PR gate.
#   - `pnpm verify` runs lint, typecheck and the vitest suites (packages/ and test/). The desktop's pure model specs live in
#     e2e/unit as Playwright specs, so they run under `pnpm test:e2e`, not under `pnpm verify`.
#   - `pnpm build` builds the desktop app, which writes THIRD-PARTY-NOTICES.md beside it. `tools/check-bundle-size.mjs` then checks
#     the build against its size budget (CONTRIBUTING.md, Bundle size). The MCP server bundle is then packed as an MCPB, which
#     checks its manifest with the pinned MCPB CLI.
#   - `pnpm test:e2e` runs the dev-server suite, and the production-preview project, which smoke-tests the build from the step
#     above on its own port (e2e/prod-smoke.spec.ts).
#   - `office-interop` writes the .xlsx corpus through the exporter (packages/exporter/test/xlsx-write-corpus.test.ts, which writes only
#     when CAOTANG_XLSX_OUT is set, so `pnpm verify` is unchanged) and checks every file with tools/office-interop/check_xlsx.py: the
#     package parts, openpyxl, then LibreOffice's CSV and its re-saved XLSX. LibreOffice (apt) and openpyxl (a venv) are installed for
#     this job alone and never ship; it is a separate job so the main gate does not wait for the install. It is not a check in Excel or
#     Numbers (docs/testing/office-interop.md).
#   - `pdf-validate` writes the PDF corpus through the exporter (packages/exporter/test/pdf-write-corpus.test.ts, which writes only when
#     CAOTANG_PDF_OUT is set, so `pnpm verify` is unchanged) and checks every file with tools/pdf-validate/check.mjs: pdf.js in Node,
#     then qpdf, Poppler, Ghostscript and MuPDF. Those are installed from apt for this job alone; they never ship, and a tool that is
#     missing fails the job rather than being skipped.
#
# Details that are load-bearing rather than tidy:
#   - permissions stay `contents: read`: the workflow needs no write token, so a pull request from a fork cannot use it to
#     change the repository. First-time contributors' runs wait for a maintainer's approval (a repository setting).
#   - pnpm comes from the packageManager field (corepack), so CI and every contributor run the same pnpm major. The lockfile
#     format depends on it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile, strict engines)
        run: pnpm install --frozen-lockfile --engine-strict

      - name: Lint, typecheck, unit tests
        run: pnpm verify

      - name: Production build (desktop app, with its notices)
        run: pnpm build

      - name: Bundle size (chunk caps, first load, total JS)
        run: node tools/check-bundle-size.mjs

      - name: Pack the MCP server bundle (manifest checked by the pinned MCPB CLI)
        run: pnpm --filter @caotang/mcp-server run pack

      - name: Build the caotang command-line bundle (one file, with its fonts/)
        run: pnpm --filter @caotang/cli run build

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end (dev suite, and the production-preview smoke test)
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  office-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAOTANG_XLSX_OUT: ${{ github.workspace }}/test-results/xlsx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install LibreOffice and openpyxl (CI only; neither ships)
        # man-db rebuilds its index after every package by default, which alone can outlast the job; it is not needed here.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice-calc
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install openpyxl==3.1.5

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write the XLSX corpus
        run: pnpm exec vitest run packages/exporter/test/xlsx-write-corpus.test.ts

      - name: Check the corpus (package parts, openpyxl, LibreOffice CSV and re-saved XLSX)
        run: '"$RUNNER_TEMP/venv/bin/python" tools/office-interop/check_xlsx.py "$CAOTANG_XLSX_OUT"'

      - name: Upload the corpus and the LibreOffice logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xlsx-corpus
          path: ${{ env.CAOTANG_XLSX_OUT }}/
          retention-days: 7

  pdf-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAOTANG_PDF_OUT: ${{ github.workspace }}/pdfs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install the PDF tools (CI only; none of them ships)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils ghostscript mupdf-tools

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write the PDF corpus
        run: pnpm exec vitest run packages/exporter/test/pdf-write-corpus.test.ts

      - name: Validate the corpus (pdf.js, qpdf, Poppler, Ghostscript, MuPDF)
        run: node tools/pdf-validate/check.mjs "$CAOTANG_PDF_OUT" --external

      - name: Upload the corpus and the tool logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-corpus
          path: ${{ env.CAOTANG_PDF_OUT }}/
          retention-days: 7
