# The standing gate: lint, typecheck, unit tests, the production build and the Playwright suite.
#
# What runs, and on which Node:
#   - `verify_matrix` runs the frozen engine-strict install, verification, build, bundle-size check, MCP pack and CLI build
#     on Node 22.12.0 and 24 for every PR and main push. Stable required `verify` waits for both matrix legs, Chromium E2E,
#     and the called Firefox/WebKit workflow; it passes only when all three gates succeed.
#   - `e2e (chromium)` runs on Node 24 in parallel with the matrix and Firefox/WebKit's four shards. The cross-browser
#     workflow merges the sharded reports and also runs nightly/on demand.
#   - `office-interop` and `pdf-validate` remain separate Node 24 jobs and run alongside the PR gate.
#   - `pnpm verify` runs lint, typecheck and the vitest suites (packages/ and test/). The desktop's pure model specs live in
#     e2e/unit as Playwright specs, so they run under `pnpm test:e2e`, not under `pnpm verify`.
#   - `pnpm build` builds the desktop app, which writes THIRD-PARTY-NOTICES.md beside it. `tools/check-bundle-size.mjs` then checks
#     the build against its size budget (CONTRIBUTING.md, Bundle size). The MCP server bundle is then packed as an MCPB, which
#     checks its manifest with the pinned MCPB CLI.
#   - `pnpm test:e2e` runs the dev-server suite, and the production-preview project, which smoke-tests the build from the step
#     above on its own port (e2e/prod-smoke.spec.ts).
#   - `office-interop` writes the .xlsx corpus through the exporter (packages/exporter/test/xlsx-write-corpus.test.ts, which writes only
#     when CAOTANG_XLSX_OUT is set, so `pnpm verify` is unchanged) and checks every file with tools/office-interop/check_xlsx.py: the
#     package parts, openpyxl, then LibreOffice's CSV and its re-saved XLSX. LibreOffice (apt) and openpyxl (a venv) are installed for
#     this job alone and never ship; it is a separate job so the main gate does not wait for the install. It is not a check in Excel or
#     Numbers (docs/testing/office-interop.md).
#   - `pdf-validate` writes the PDF corpus through the exporter (packages/exporter/test/pdf-write-corpus.test.ts, which writes only when
#     CAOTANG_PDF_OUT is set, so `pnpm verify` is unchanged) and checks every file with tools/pdf-validate/check.mjs: pdf.js in Node,
#     then qpdf, Poppler, Ghostscript and MuPDF. Those are installed from apt for this job alone; they never ship, and a tool that is
#     missing fails the job rather than being skipped.
#
# Details that are load-bearing rather than tidy:
#   - permissions stay `contents: read`: the workflow needs no write token, so a pull request from a fork cannot use it to
#     change the repository. First-time contributors' runs wait for a maintainer's approval (a repository setting).
#   - CI uses the exact pnpm release and integrity in the packageManager field. Node 22.12.0's bundled Corepack 0.29.4 cannot
#     verify pnpm 12.9.1's current signing key, and an updated Corepack left an incomplete cache on the hosted runner. That
#     matrix leg installs the pinned pnpm tarball only after checking its SHA-512 against packageManager; Node 24 uses Corepack.
#     The lockfile format depends on the pnpm major.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_matrix:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned pnpm for Node 22.12.0
        if: matrix.node == '22.12.0'
        run: |
          spec="$(node -p "require('./package.json').packageManager")"
          version="${spec#pnpm@}"
          version="${version%%+*}"
          expected="${spec#*+}"
          tarball_name="$(npm pack "pnpm@$version" --pack-destination "$RUNNER_TEMP" --silent)"
          tarball="$RUNNER_TEMP/$tarball_name"
          actual_integrity="$(node -e 'const fs = require("node:fs"), crypto = require("node:crypto"); process.stdout.write(`sha512.${crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("hex")}`)' "$tarball")"
          test "$actual_integrity" = "$expected"
          npm install --prefix "$RUNNER_TEMP/pnpm" --no-save "$tarball"
          test "$("$RUNNER_TEMP/pnpm/node_modules/.bin/pnpm" --version)" = "$version"
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Enable corepack (pnpm from packageManager)
        if: matrix.node != '22.12.0'
        run: corepack enable

      - name: Install (frozen lockfile, strict engines)
        run: pnpm install --frozen-lockfile --engine-strict

      - name: Lint, typecheck, unit tests
        run: pnpm verify

      - name: Production build (desktop app, with its notices)
        run: pnpm build

      - name: Bundle size (chunk caps, first load, total JS)
        run: node tools/check-bundle-size.mjs

      - name: Pack the MCP server bundle (manifest checked by the pinned MCPB CLI)
        run: pnpm --filter @caotang/mcp-server run pack

      - name: Build the caotang command-line bundle (one file, with its fonts/)
        run: pnpm --filter @caotang/cli run build

      - name: Scan the fixture project with the built command (exit 7, one error annotation, nothing written)
        run: |
          code=0
          node packages/cli/dist/caotang.mjs scan --project packages/cli/test/fixtures/continuity-project --format github > "$RUNNER_TEMP/scan.out" || code=$?
          cat "$RUNNER_TEMP/scan.out"
          test "$code" = 7
          test "$(grep -c '^::error ' "$RUNNER_TEMP/scan.out")" = 1
          grep -q '^::error file=docs/n_7K2QX9M4A1.md,line=10,endLine=11,title=presence.expected::' "$RUNNER_TEMP/scan.out"
          test -z "$(git status --porcelain -- packages/cli/test/fixtures/continuity-project)"

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [verify_matrix, e2e, e2e_browsers]
    if: always()
    steps:
      - name: Require Node matrix and all browser runs
        env:
          MATRIX_RESULT: ${{ needs.verify_matrix.result }}
          CHROMIUM_RESULT: ${{ needs.e2e.result }}
          CROSS_BROWSER_RESULT: ${{ needs.e2e_browsers.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$CHROMIUM_RESULT" = success
          test "$CROSS_BROWSER_RESULT" = success

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        # --with-deps installs Chromium's system packages through apt: write the retry setting first (tools/ci/apt-install.sh).
        run: |
          bash tools/ci/apt-install.sh
          pnpm exec playwright install --with-deps chromium

      - name: End-to-end (dev suite, and the production-preview smoke test)
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e_browsers:
    name: Firefox and WebKit E2E
    uses: ./.github/workflows/e2e-browsers.yml
    permissions:
      contents: read

  office-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAOTANG_XLSX_OUT: ${{ github.workspace }}/test-results/xlsx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Week stamp for the kept apt packages
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the kept LibreOffice packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.apt-archives/*.deb
          key: apt-libreoffice-${{ steps.week.outputs.week }}
          restore-keys: apt-libreoffice-

      - name: Install LibreOffice and openpyxl (CI only; neither ships)
        # tools/ci/apt-install.sh retries a slow mirror within a time limit instead of letting it run out the job's time.
        run: |
          APT_ARCHIVES="$GITHUB_WORKSPACE/.apt-archives" bash tools/ci/apt-install.sh libreoffice-calc
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install openpyxl==3.1.5

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write the XLSX corpus
        run: pnpm exec vitest run packages/exporter/test/xlsx-write-corpus.test.ts

      - name: Check the corpus (package parts, openpyxl, LibreOffice CSV and re-saved XLSX)
        run: '"$RUNNER_TEMP/venv/bin/python" tools/office-interop/check_xlsx.py "$CAOTANG_XLSX_OUT"'

      - name: Upload the corpus and the LibreOffice logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xlsx-corpus
          path: ${{ env.CAOTANG_XLSX_OUT }}/
          retention-days: 7

  pdf-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAOTANG_PDF_OUT: ${{ github.workspace }}/pdfs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Week stamp for the kept apt packages
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the kept PDF tool packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.apt-archives/*.deb
          key: apt-pdf-tools-${{ steps.week.outputs.week }}
          restore-keys: apt-pdf-tools-

      - name: Install the PDF tools (CI only; none of them ships)
        # tools/ci/apt-install.sh retries a slow mirror within a time limit instead of letting it run out the job's time.
        run: APT_ARCHIVES="$GITHUB_WORKSPACE/.apt-archives" APT_DOWNLOAD_SECONDS=180 bash tools/ci/apt-install.sh qpdf poppler-utils ghostscript mupdf-tools

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write the PDF corpus
        run: pnpm exec vitest run packages/exporter/test/pdf-write-corpus.test.ts

      - name: Validate the corpus (pdf.js, qpdf, Poppler, Ghostscript, MuPDF)
        run: node tools/pdf-validate/check.mjs "$CAOTANG_PDF_OUT" --external

      - name: Upload the corpus and the tool logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-corpus
          path: ${{ env.CAOTANG_PDF_OUT }}/
          retention-days: 7
