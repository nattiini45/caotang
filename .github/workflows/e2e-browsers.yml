# Firefox and WebKit E2E, called by ci.yml as part of the required PR gate; the nightly run comes from ci.yml's own schedule, so
# this workflow carries no schedule of its own and a night is run once, and it also runs on demand.
#
# What runs:
#   - The `firefox` and `webkit` projects of playwright.config.ts (they exist only with CAOTANG_E2E_BROWSERS=all), in three shards
#     each plus a `Modern gate` leg each, so eight jobs. The shards leave the Modern reachability walk and accessibility gate
#     (#313) to that leg (CAOTANG_E2E_MODERN_GATE=skip), so no leg runs near its limit. They skip e2e/unit, the production smoke
#     and the provider specs, and the specs that need File System Access skip themselves outside Chromium.
#     e2e/non-chromium-storage.spec.ts covers the bundle-only path instead.
#   - Firefox splits by test count, as Playwright's `--shard` does. WebKit splits by measured duration instead
#     (`tools/ci/webkit-shards.mjs`, the planner Chromium's shards share): its specs differ by more than a hundredfold, so a
#     count-based third leaves one leg with the slow ones, and that leg is the one that reached the 40-minute limit (#689).
#     The tool falls back to `--shard=<n>/3` and says so when it cannot build a plan that covers every spec exactly once.
#   - Each shard writes a blob report. One job merges them into a single HTML report, uploaded when any shard failed.
#
# Details that are load-bearing rather than tidy:
#   - WebKit on Linux is not Safari: it catches engine differences, not every macOS Safari quirk.
#   - A failure here is a real cross-browser bug or a flake to fix, not a leg to mark continue-on-error.
#   - permissions stay `contents: read`: sharding and merging need only the artifact actions, which use the run's own token.
name: e2e-browsers

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-browsers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard == 'modern' && 'Modern gate' || format('{0}/3', matrix.shard) }})
    runs-on: ubuntu-latest
    # Keep the preinstalled browser binaries and Linux dependencies aligned with the locked Playwright 1.63.0 package.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # Three shards per browser restore headroom under this unchanged limit: Firefox after its two-shard suite used 37m04s of it, and
    # WebKit after its second shard twice reached it without writing its report (#689).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        # Numbered legs split the suite; `modern` is the Modern gate's leg. Both browsers run all three.
        shard: [1, 2, 3, modern]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # GitHub's /github/home is owned by pwuser, but the container runs as root and Firefox checks HOME ownership, so every leg
      # that starts a browser sets HOME to /root.
      - name: End-to-end (firefox, shard ${{ matrix.shard }} of 3)
        if: ${{ matrix.shard != 'modern' && matrix.browser == 'firefox' }}
        run: pnpm exec playwright test --project=firefox --shard=${{ matrix.shard }}/3 --workers=2 --reporter=blob,list
        env:
          HOME: /root
          CI: 'true'
          CAOTANG_E2E_BROWSERS: all
          CAOTANG_E2E_MODERN_GATE: skip

      - name: End-to-end (webkit, duration-balanced shard)
        if: ${{ matrix.shard != 'modern' && matrix.browser == 'webkit' }}
        run: node tools/ci/webkit-shards.mjs "$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
          HOME: /root
          CI: 'true'
          CAOTANG_E2E_BROWSERS: all
          CAOTANG_E2E_MODERN_GATE: skip

      - name: End-to-end (${{ matrix.browser }}, the Modern reachability walk and accessibility gate)
        if: ${{ matrix.shard == 'modern' }}
        run: pnpm exec playwright test --project=${{ matrix.browser }} --workers=2 --reporter=blob,list e2e/modern-reachability.spec.ts e2e/modern-gate.spec.ts
        env:
          HOME: /root
          CI: 'true'
          CAOTANG_E2E_BROWSERS: all

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-reports:
    name: merge reports
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload the HTML report when a shard failed
        if: ${{ needs.e2e.result != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
