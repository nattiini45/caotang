# Firefox and WebKit E2E, called by ci.yml as part of the required PR gate; also runs nightly and on demand.
#
# What runs:
#   - The `firefox` and `webkit` projects of playwright.config.ts (they exist only with CAOTANG_E2E_BROWSERS=all), each in two
#     shards plus a `Modern gate` leg, so six jobs in parallel. The shards leave the Modern reachability walk and accessibility gate
#     (#313) to that leg (CAOTANG_E2E_MODERN_GATE=skip), so no leg runs near its limit. They skip e2e/unit, the production smoke
#     and the provider specs, and the specs that need File System Access skip themselves outside Chromium.
#     e2e/non-chromium-storage.spec.ts covers the bundle-only path instead.
#   - Each shard writes a blob report. One job merges them into a single HTML report, uploaded when any shard failed.
#
# Details that are load-bearing rather than tidy:
#   - WebKit on Linux is not Safari: it catches engine differences, not every macOS Safari quirk.
#   - A failure here is a real cross-browser bug or a flake to fix, not a leg to mark continue-on-error.
#   - permissions stay `contents: read`: sharding and merging need only the artifact actions, which use the run's own token.
name: e2e-browsers

on:
  workflow_call:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-browsers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard == 'modern' && 'Modern gate' || format('{0}/2', matrix.shard) }})
    runs-on: ubuntu-latest
    # Keep the preinstalled browser binaries and Linux dependencies aligned with the locked Playwright 1.63.0 package.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        # 1 and 2 are the suite's shards; `modern` is the Modern gate's leg.
        shard: [1, 2, modern]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: End-to-end (${{ matrix.browser }}, shard ${{ matrix.shard }} of 2)
        if: ${{ matrix.shard != 'modern' }}
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          # GitHub's /github/home is owned by pwuser, but this container runs as root and Firefox checks HOME ownership.
          HOME: /root
          CI: 'true'
          CAOTANG_E2E_BROWSERS: all
          CAOTANG_E2E_MODERN_GATE: skip

      - name: End-to-end (${{ matrix.browser }}, the Modern reachability walk and accessibility gate)
        if: ${{ matrix.shard == 'modern' }}
        run: pnpm exec playwright test --project=${{ matrix.browser }} --reporter=blob e2e/modern-reachability.spec.ts e2e/modern-gate.spec.ts
        env:
          HOME: /root
          CI: 'true'
          CAOTANG_E2E_BROWSERS: all

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-reports:
    name: merge reports
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload the HTML report when a shard failed
        if: ${{ needs.e2e.result != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
